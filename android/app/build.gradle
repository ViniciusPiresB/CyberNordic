apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.sinaisbuzz.app"
    compileSdk = 36

    defaultConfig {
        applicationId "com.sinaisbuzz.app"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "2.0"
        // Só processadores ARM (celulares e tablets); 32 bits inclui aparelhos antigos
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildFeatures { viewBinding true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Áudios, ícones e o modelo de mãos vêm da pasta web/, compartilhada com a versão para navegador.
    // O motor WebAssembly (pasta wasm e .mjs) só serve para o navegador e fica de fora do APK.
    sourceSets {
        main.assets.srcDirs += ['../../web/assets', '../../web/vendor/mediapipe']
    }
    androidResources {
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!wasm:!*.mjs'
        noCompress 'task'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    def camerax = '1.6.2'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'com.google.mediapipe:tasks-vision:0.10.35'
}
